name: Follow-money terms and funding records
on:
  push:
    branches: [arena/a243c6bf-thereelwindycity]
    paths:
      - '.github/workflows/follow-money-evidence.yml'
      - 'tools/follow_money_evidence.py'
      - 'tools/test_follow_money_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        case: [interfund, reed_budget, current_budget]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf beautifulsoup4
      - name: Test discovery and evidence integrity
        run: |
          python -m unittest discover -s tools -p 'test_follow_money_evidence.py' -v
          python -m unittest discover -s tools -p 'test_remaining_target_evidence.py' -v
      - name: Capture linked original records
        run: python tools/follow_money_evidence.py --case '${{ matrix.case }}'
      - name: Retain originals and discovery provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: follow-money-${{ matrix.case }}-${{ github.run_id }}
          path: arena_workspace/follow-money/${{ matrix.case }}/
          if-no-files-found: error
          retention-days: 14
