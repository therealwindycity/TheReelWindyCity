name: Fleet procurement source capture
on:
  push:
    branches: [arena/a243c6bf-thereelwindycity]
    paths:
      - '.github/workflows/fleet-case-evidence.yml'
      - 'tools/fleet_case_evidence.py'
      - 'tools/test_fleet_case_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf
      - name: Test transport and source failure boundaries
        run: python -m unittest discover -s tools -p 'test_fleet_case_evidence.py' -v
      - name: Capture original public PDFs and selected review pages
        run: python tools/fleet_case_evidence.py
      - name: Preserve originals and full extracted text even on capture failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-case-${{ github.run_id }}
          path: arena_workspace/fleet-case/
          if-no-files-found: error
          retention-days: 14
