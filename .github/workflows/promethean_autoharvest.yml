name: Promethean Autonomous Granicus Harvester

on:
  workflow_dispatch:
    inputs:
      granicus_url:
        description: "Target Granicus Agenda / ViewPublisher URL"
        required: true
        default: "https://cheyenne.granicus.com/ViewPublisher.php?view_id=1"
      output_prefix:
        description: "Dossier Prefix"
        required: true
        default: "Cheyenne_PS_Committee_Nov2"
      committee_name:
        description: "Committee or Body Name"
        required: true
        default: "Public Services Committee"
      meeting_date:
        description: "Meeting Date (YYYY-MM-DD)"
        required: true
        default: "2026-11-02"
  schedule:
    # Runs automatically every Monday and Friday at 13:00 UTC (7:00 AM MDT)
    - cron: "0 13 * * 1,5"

permissions:
  contents: write

jobs:
  harvest-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Forensic Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pandas streamlit

      - name: Initialize SQLite Rhetorical Profiling Schema
        run: |
          mkdir -p database artifacts
          sqlite3 database/promethean_evidence.db < database/schema_rhetorical_profiling.sql

      - name: Execute Hardened Granicus Harvester
        run: |
          TARGET_URL="${{ github.event.inputs.granicus_url || 'https://cheyenne.granicus.com/ViewPublisher.php?view_id=1' }}"
          PREFIX="${{ github.event.inputs.output_prefix || 'Cheyenne_Auto_Audit' }}"
          COMMITTEE="${{ github.event.inputs.committee_name || 'Cheyenne Governing Body' }}"
          MDATE="${{ github.event.inputs.meeting_date || '2026-11-02' }}"
          python3 scrapers/granicus_harvester.py "$TARGET_URL" --prefix "$PREFIX" --committee "$COMMITTEE" --date "$MDATE"

      - name: Commit & Push Updated Evidence Archive
        run: |
          git config user.name "Promethean-AutoHarvester"
          git config user.email "bartimoussmith-oss@users.noreply.github.com"
          git add database/ *.md *.pdf || true
          if git diff --cached --quiet; then
            echo "[*] No new statutory packets detected in this cycle."
          else
            git commit -m "Automated Forensic Harvest: Updated SQLite FTS5 & Dossier Summaries"
            git push origin HEAD:main
          fi
