name: Verify public meeting features

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public HTML features for CM
        env:
          SITE_URL: https://therealwindycity.github.io/TheReelWindyCity/
        shell: python
        run: |
          import os, time, urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          class Features(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meetings = False
                  self.freshness = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  self.meetings |= attrs.get('id') == 'upcoming-meetings-title'
                  self.freshness |= attrs.get('data-schedule-check') in ('recent', 'overdue', 'unknown', 'failed')
          error = None
          for attempt in range(1, 7):
              try:
                  url = os.environ['SITE_URL'] + '?verification=' + str(time.time_ns())
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'CM-Public-Feature-Check/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      html = response.read(10000001)
                  if len(html) > 10000000:
                      raise ValueError('Homepage exceeds verification byte limit')
                  features = Features()
                  features.feed(html.decode('utf-8'))
                  if not features.meetings or not features.freshness:
                      raise ValueError(f'Missing public features: meetings={features.meetings}, freshness={features.freshness}')
                  error = None
                  break
              except Exception as exc:
                  error = str(exc)
                  if attempt < 6:
                      time.sleep(15)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## CM public meeting feature verification\n')
              summary.write('Checked at: ' + datetime.now(timezone.utc).isoformat() + '\n')
              summary.write('Result: ' + ('FAILED: ' + error if error else 'Required meeting and freshness HTML features found.') + '\n')
              summary.write('Scope: feature presence only; not exact deployed revision, browser behavior, source freshness, or complete coverage.\n')
          if error:
              raise SystemExit(error)
