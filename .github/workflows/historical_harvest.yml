name: Promethean Recurring Harvest
on:
  push:
    branches: [main]
    paths: [.github/workflows/historical_harvest.yml]
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    inputs:
      max_seconds:
        description: "Wall-clock budget per source, in seconds"
        required: false
        default: "900"
permissions:
  contents: write
concurrency:
  group: promethean-evidence-db
  cancel-in-progress: false
jobs:
  harvest:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Validate repaired harvest publication'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'push' && 15 || 75 }}
    env:
      HARVEST_MAX_SECONDS: ${{ github.event.inputs.max_seconds || (github.event_name == 'push' && '120' || '900') }}
      HARVEST_MAX_NEW: ${{ github.event_name == 'push' && '5' || '200' }}
      HARVEST_DELAY_SECONDS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install System OCR & PDF Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr sqlite3 gh
      - name: Install Python Dependencies
        run: pip install requests beautifulsoup4 pypdf pdfplumber pytesseract pdf2image
      - name: Harvester regression tests (offline)
        run: python3 -m unittest tests/test_granicus_harvester.py tests/test_harvest_publication.py -v
      - name: Execute Extraction Pipelines
        run: |
          set -uo pipefail
          echo "# Promethean Harvest Telemetry - $(date -u)" > SYSTEM_DIAGNOSTICS.md
          echo '```text' >> SYSTEM_DIAGNOSTICS.md
          HOST="https://cheyenne.granicus.com"
          reached=0
          failed=0
          run_source() {
            if "$@" 2>&1 | tee -a SYSTEM_DIAGNOSTICS.md; then reached=$((reached + 1)); else failed=$((failed + 1)); fi
          }
          run_source python3 scrapers/granicus_harvester.py "${HOST}/ViewPublisher.php?view_id=5" --historical
          run_source python3 scrapers/granicus_harvester.py "${HOST}/ViewPublisher.php?view_id=2" --historical
          if [ -f "scrapers/connect_cheyenne_harvester.py" ]; then
            run_source python3 scrapers/connect_cheyenne_harvester.py
          fi
          echo "[sources] reached=${reached} failed=${failed}" | tee -a SYSTEM_DIAGNOSTICS.md
          {
            echo "### Promethean Recurring Harvest"
            echo "Sources reached: ${reached}; unreachable: ${failed}. This bounded collection is not complete records coverage."
            echo '```'
            grep -F '[summary]' SYSTEM_DIAGNOSTICS.md || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$reached" -gt 0 ]
      - name: Require A Real Payload For Push Validation
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ ! -d artifacts ] || ! find artifacts -type f -name '*.pdf' -print -quit | grep -q .; then
            echo '::error::No PDF payload was captured; storage publication has not been validated.'
            exit 1
          fi
      - name: Publish Payloads In Existing Repository
        id: storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/storage_shard_manager.sh 2>&1 | tee -a SYSTEM_DIAGNOSTICS.md
      - name: Preserve Failed Publication For Recovery
        if: failure() && steps.storage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-harvest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            database/promethean_evidence.db*
            SYSTEM_DIAGNOSTICS.md
          retention-days: 1
          if-no-files-found: warn
      - name: Publish Telemetry And Verified Database Progress
        if: always()
        env:
          STORAGE_OUTCOME: ${{ steps.storage.outcome }}
        run: |
          set -euo pipefail
          echo '```' >> SYSTEM_DIAGNOSTICS.md
          if [ "$STORAGE_OUTCOME" = "success" ]; then
            sqlite3 database/promethean_evidence.db "PRAGMA wal_checkpoint(TRUNCATE);"
            if [ -f database/promethean_evidence.db ]; then git add -- database/promethean_evidence.db; fi
            if [ -f STORAGE_MANIFEST.md ]; then git add -- STORAGE_MANIFEST.md; fi
          else
            # Never advance database progress when its source files were not published.
            git restore -- database/promethean_evidence.db
            rm -f database/promethean_evidence.db-wal database/promethean_evidence.db-shm
            echo '[storage] Publication did not succeed; database progress was not committed.' >> SYSTEM_DIAGNOSTICS.md
          fi
          git config user.name "Promethean-AutoHarvester"
          git config user.email "cwdm82001@gmail.com"
          git add -- SYSTEM_DIAGNOSTICS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Automated Harvest Telemetry & Data Sync [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "::error::Harvest results could not be pushed after three attempts."
          exit 1
