name: Live Place Archives

# Copies public documents from each Wyoming government's own site into that
# place's archive. Opens civic-wy-<layer>-<id>, then civic-wy-<layer>-<id>-docs-2
# when the first repo passes 250 files. Does not relabel Cheyenne records.

on:
  schedule:
    - cron: "41 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wyoming-place-archives
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Copy public documents and open the next archive repo when one fills
        env:
          PLACE_ARCHIVE_TOKEN: ${{ secrets.PLACE_ARCHIVE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync/place-archives.mjs --provision --harvest --limit 40

      - name: Commit copied files in this site repo
        run: |
          git config user.name "civic-cheyenne-watcher"
          git config user.email "civic-cheyenne-watcher@users.noreply.github.com"
          git add src/data/place-archives.json public/place-docs
          if git diff --cached --quiet; then
            echo "No new public documents."
          else
            git commit -m "Copy public place documents ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase origin main
            git push origin main
          fi
