name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:
  # Static Pages has no runtime RSS proxy; rebuild and publish the newsroom
  # snapshot hourly so the public news lanes stay genuinely current.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore scanner-archive linkage cache
        uses: actions/cache@v4
        with:
          path: .cache/scanner-archive-links
          key: scanner-archive-links-${{ github.run_id }}
          restore-keys: scanner-archive-links-
      - name: Refresh the Socrata ↔ scanner-archive linkage database
        # Rebuilds the log → archive-block database for every linkable day.
        # Broadcastify feed archives keep a rolling ~6-month window, so the
        # sync window rolls with it. The sync fails closed; on any publisher
        # problem this step is skipped and the build falls back to the
        # committed seed artifact — an outage can never blank the public
        # database. --allow-large: the full linkable window is ~60k rows by
        # design (see MAX_COMMITTED_LINKS in the sync script).
        continue-on-error: true
        run: node scripts/sync/scanner-archive-links.mjs --start "$(date -u -d '180 days ago' +%F)" --allow-large
      - name: Check the city's posted-meeting table (bounded; fails open)
        # Keeps "next meeting" honest: the build can use a real, timestamped
        # posting instead of a frozen snapshot. This never advances the watcher
        # baseline, never triggers a sync, and writes an explicit ok:false
        # record if the publisher is unreachable. The build then falls back to
        # the committed snapshot and says so.
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/sync/snapshot-upcoming.mjs --out data/source-check.json --timeout-ms 10000 --attempts 2

      - name: Restore legal audit discovery cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .sync/legal-audit-cache.json
            .sync/legal-evidence-cache.json
          key: legal-audit-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: legal-audit-v2-
      - name: Discover and screen official meeting agendas
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: |
          npm run data:assemble
          node scripts/analysis/legal-audit.mjs --refresh --limit 12
          node scripts/analysis/legal-evidence.mjs --refresh
      - name: Save legal audit discovery cache
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: |
            .sync/legal-audit-cache.json
            .sync/legal-evidence-cache.json
          key: legal-audit-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enable GitHub Pages (if not already enabled)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Build static site
        run: |
          set -o pipefail
          echo '### Command: `npm run build`' >> CI_DIAGNOSTICS.md
          echo '```text' >> CI_DIAGNOSTICS.md
          npm run build 2>&1 | tee -a CI_DIAGNOSTICS.md
          echo '```' >> CI_DIAGNOSTICS.md
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Upload Build Diagnostics Artifact (Runs Even On Failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-diagnostics
          path: CI_DIAGNOSTICS.md
          if-no-files-found: ignore

  deploy:
    needs: build
    # The github-pages environment is protected to the default branch; feature
    # branches are build-checked but must not attempt a production deployment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      # Search Console reads the published files, not the build artifacts. Fail
      # the deploy if the live sitemap is unreachable, advertises another host,
      # or lists fewer pages than the archive in this commit.
      - name: Verify the published sitemap and robots.txt
        run: node scripts/check-live-seo.mjs --retries 6 --delay 10000
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}