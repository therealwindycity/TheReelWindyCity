name: Deploy to GitHub Pages
on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch: {}
  schedule:
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CM calendar and source-check regression gate
        run: npm run test:calendar && npm run test:sync
      - name: Restore scanner-archive linkage cache
        uses: actions/cache@v4
        with:
          path: .cache/scanner-archive-links
          key: scanner-archive-links-${{ github.run_id }}
          restore-keys: scanner-archive-links-
      - name: Refresh the Socrata scanner-archive linkage database
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/sync/scanner-archive-links.mjs --start "$(date -u -d '180 days ago' +%F)" --allow-large
      - name: Check official posted meetings with explicit unavailable state
        timeout-minutes: 2
        run: node scripts/sync/snapshot-upcoming.mjs --out data/source-check.json --timeout-ms 10000 --attempts 2
      - name: Restore legal audit discovery cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .sync/legal-audit-cache.json
            .sync/legal-evidence-cache.json
            .sync/legal-support-cache.json
          key: legal-audit-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            legal-audit-v3-
            legal-audit-v2-
      - name: Discover and screen official meeting agendas
        timeout-minutes: 15
        run: |
          npm run data:assemble
          node scripts/analysis/legal-audit.mjs --refresh --limit 12
          node scripts/analysis/legal-evidence.mjs --refresh
          node scripts/analysis/legal-support.mjs --refresh
      - name: Save legal audit discovery cache
        uses: actions/cache/save@v4
        with:
          path: |
            .sync/legal-audit-cache.json
            .sync/legal-evidence-cache.json
            .sync/legal-support-cache.json
          key: legal-audit-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enable GitHub Pages if not already enabled
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee CI_DIAGNOSTICS.md
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Stamp exact built revision without claiming fresh collection
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          status = Path('out/status')
          status.mkdir(parents=True, exist_ok=True)
          manifest = {'schema': 1, 'project_credit': 'CM', 'revision': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'built_at': datetime.now(timezone.utc).isoformat(), 'scope': 'Build identity only; not source freshness or complete coverage.'}
          (status / 'deployment.json').write_text(json.dumps(manifest, indent=2) + '\n')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Preserve build and collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-diagnostics
          path: |
            CI_DIAGNOSTICS.md
            data/source-check.json
            out/status/deployment.json
          if-no-files-found: warn
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public revision and run
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import json, os, time, urllib.request
          base = os.environ['LIVE_SITE_URL'].rstrip('/')
          error = 'Public revision not checked'
          for attempt in range(6):
              try:
                  url = base + '/status/deployment.json?verify=' + str(time.time_ns())
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.loads(response.read(65536))
                  if data.get('revision') != os.environ['GITHUB_SHA'] or str(data.get('run_id')) != os.environ['GITHUB_RUN_ID']:
                      raise ValueError('Served revision or workflow run does not match this deployment')
                  error = None
                  break
              except Exception as exc:
                  error = str(exc)
                  if attempt < 5:
                      time.sleep(10)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## CM public revision verification\n')
              summary.write(('FAILED: ' + error if error else 'Exact revision and workflow run verified: ' + os.environ['GITHUB_SHA']) + '\n')
              summary.write('This does not certify source freshness or coverage.\n')
          if error:
              raise SystemExit(error)
      - name: Verify published sitemap and robots.txt
        run: node scripts/check-live-seo.mjs --retries 6 --delay 10000
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
