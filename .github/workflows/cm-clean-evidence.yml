name: CM clean candidate evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cm-clean-evidence.yml']
  workflow_run:
    workflows: ['CM clean candidate validation']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  actions: read
  contents: write
concurrency:
  group: cm-clean-evidence
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const target = {...context.repo};
            const runs = (await github.rest.actions.listWorkflowRunsForRepo({...target,branch:'main',per_page:100})).data.workflow_runs;
            const run = runs.find(r=>r.name==='CM clean candidate validation');
            const report = {schema:1,project_credit:'CM',observed_at:new Date().toISOString(),scope:'Candidate execution metadata only; no production cutover or source-freshness certification',run:null};
            if(run) {
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({...target,run_id:run.id,per_page:30})).data.jobs;
              report.run = {id:run.id,sha:run.head_sha,url:run.html_url,status:run.status,conclusion:run.conclusion,jobs:jobs.map(j=>({name:j.name,url:j.html_url,status:j.status,conclusion:j.conclusion,steps:(j.steps||[]).map(s=>({name:s.name,conclusion:s.conclusion}))}))};
            }
            const branch='cm-deployment-status';
            try { await github.rest.git.getRef({...target,ref:'heads/'+branch}); }
            catch(e) { if(e.status!==404)throw e; const head=await github.rest.repos.getCommit({...target,ref:'main'}); await github.rest.git.createRef({...target,ref:'refs/heads/'+branch,sha:head.data.sha}); }
            const path='status/clean-candidate.json';
            let sha;
            try {sha=(await github.rest.repos.getContent({...target,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...target,branch,path,sha,message:'CM: record clean candidate build evidence [skip ci]',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});
            await core.summary.addHeading('CM clean candidate execution').addRaw(run ? `${run.html_url}: ${run.status} / ${run.conclusion}` : 'No candidate run found in the latest 100 main-branch runs.').write();
