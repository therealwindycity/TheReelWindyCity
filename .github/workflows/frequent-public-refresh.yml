name: Frequent public refresh
on:
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
concurrency:
  group: frequent-public-refresh
  cancel-in-progress: false
jobs:
  coordinate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: CM manual refresh requests
        shell: bash
        run: |
          set -euo pipefail
          for workflow in live_city_watch.yml deploy-pages.yml; do
            runs=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&per_page=100")
            active=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<< "$runs")
            if [ "$active" -gt 0 ]; then
              echo "Skipped $workflow: active run exists." >> "$GITHUB_STEP_SUMMARY"
            else
              gh workflow run "$workflow" --ref main
              echo "Requested $workflow; completion not verified by this request." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
