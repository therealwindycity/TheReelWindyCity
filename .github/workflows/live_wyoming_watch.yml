name: Live Wyoming Watch
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/monitor/wyoming-watch.mjs
      - .github/workflows/live_wyoming_watch.yml
  pull_request:
    paths:
      - scripts/monitor/wyoming-watch*.mjs
      - scripts/lib/wyoming-adapters.mjs
      - scripts/data/wyoming-ecosystem-catalog.mjs
permissions:
  contents: write
concurrency:
  group: wyoming-ecosystem-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate collector syntax
        run: node --check scripts/monitor/wyoming-watch.mjs
      - name: Watch every configured Wyoming government
        id: watch
        continue-on-error: true
        timeout-minutes: 80
        run: node scripts/monitor/wyoming-watch.mjs --check --update-state --state data/wyoming-sync-state.json --out .sync/wyoming-watch.json
      - name: Explain this run
        if: always()
        run: |
          if [ -f .sync/wyoming-watch.json ]; then
            node scripts/monitor/wyoming-watch-summary.mjs .sync/wyoming-watch.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Wyoming Watch did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyoming-watch-report
          path: .sync/wyoming-watch.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Commit successful baselines and latest report
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name civic-cheyenne-watcher
          git config user.email civic-cheyenne-watcher@users.noreply.github.com
          if [ -f .sync/wyoming-watch.json ]; then
            cp .sync/wyoming-watch.json data/wyoming-watch-latest.json
          fi
          git add data/wyoming-sync-state.json
          if [ -f data/wyoming-watch-latest.json ]; then git add data/wyoming-watch-latest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Wyoming watch results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Fail only for total collection failure
        if: steps.watch.outcome == 'failure'
        run: exit 1
