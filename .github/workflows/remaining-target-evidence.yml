name: Remaining civic target source capture
on:
  push:
    branches: [arena/a243c6bf-thereelwindycity]
    paths:
      - '.github/workflows/remaining-target-evidence.yml'
      - 'tools/remaining_target_evidence.py'
      - 'tools/test_remaining_target_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        case: [debt, highlands, stormwater, reed_vouchers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf
      - name: Test shared capture and target boundaries
        run: |
          python -m unittest discover -s tools -p 'test_fleet_case_evidence.py' -v
          python -m unittest discover -s tools -p 'test_remaining_target_evidence.py' -v
      - name: Capture original records and selected review pages
        run: python tools/remaining_target_evidence.py --case '${{ matrix.case }}'
      - name: Preserve originals and full extracted reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-target-${{ matrix.case }}-${{ github.run_id }}
          path: arena_workspace/other-targets/${{ matrix.case }}/
          if-no-files-found: error
          retention-days: 14
